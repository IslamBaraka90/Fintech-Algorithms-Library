name: Release

# Publishing happens here, never from a laptop. Pushing a `v*` tag is the only
# trigger, so the tarball on npm is always built from a commit that exists in
# this repository's history — and the provenance attestation proves it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the GitHub Release that carries the changelog
  id-token: write # required for provenance; also how trusted publishing authenticates

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships npm 10.x; trusted publishing (OIDC, no stored token)
      # requires npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      # A tag that disagrees with package.json would publish a version nobody
      # can trace back. Fail before anything is built.
      - name: Refuse to publish if the tag and package.json disagree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag is v$TAG but package.json says $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      - name: Verify
        run: npm run verify

      # The same clean-consumer smoke test CI runs, repeated here because
      # publishing is irreversible: a version number can never be reused.
      - name: Pack and smoke-test the tarball
        run: |
          npm pack
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/fintech-algorithms-*.tgz
          node --input-type=module -e '
            import { topics } from "fintech-algorithms";
            const { calculateEma } = await import("fintech-algorithms/technical-indicators/trend-smoothing/ema");
            if (topics.length === 0) throw new Error("registry is empty");
            const out = calculateEma([10, 13, 16, 19], 3);
            if (out[2] !== 13 || out[3] !== 16) throw new Error("EMA regression: " + JSON.stringify(out));
            console.log(`tarball OK — ${topics.length} topics resolvable from a clean consumer`);
          '
          node --input-type=commonjs -e '
            const { topics } = require("fintech-algorithms");
            const { calculateEma } = require("fintech-algorithms/technical-indicators/trend-smoothing/ema");
            if (topics.length === 0) throw new Error("registry is empty");
            const out = calculateEma([10, 13, 16, 19], 3);
            if (out[2] !== 13 || out[3] !== 16) throw new Error("EMA regression: " + JSON.stringify(out));
            console.log(`tarball OK from CommonJS — ${topics.length} topics`);
          '

      # No NODE_AUTH_TOKEN: npm authenticates over OIDC via the trusted
      # publisher configured on npmjs.com for this repository and workflow file.
      # Provenance is generated automatically as a result.
      - name: Publish to npm
        run: npm publish --provenance --access public

      # Until now the changelog was only visible to someone who opened
      # CHANGELOG.md in this repository. npm renders the README and not the
      # changelog, and no GitHub Release had ever been created, so a consumer who
      # hit a behaviour change had nowhere obvious to look. Every release is
      # already tag-driven, so the notes may as well travel with the tag.
      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # The section for this version: from its heading to the next one.
          awk -v v="## $VERSION " '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for $VERSION — refusing to publish empty notes." >&2
            exit 1
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag

      # The reference site rebuilds from `docs.json` on this repository's main
      # branch rather than from a published release, which is what lets a
      # documentation fix ship without burning a version number. It picks changes
      # up on a daily schedule, so after a release the site can lag the package
      # by up to a day — harmless for prose, confusing when 199 subpaths appear
      # on npm and the reference does not list them yet.
      #
      # The docs repository deliberately has no cross-repository trigger, because
      # that needs a personal access token and everything else here is
      # credential-free. So this asks rather than requires: with a token present
      # the site rebuilds immediately, and without one the run prints the single
      # command that does it by hand. Never fatal — the package is already
      # published by this point, and a lagging site is not worth a red release.
      - name: Refresh the reference site
        if: always()
        env:
          DOCS_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DOCS_TOKEN" ]; then
            echo "::notice::No DOCS_DISPATCH_TOKEN secret is set, so the reference site was not rebuilt."
            echo "::notice::It will pick this release up on its next scheduled run (06:00 UTC)."
            echo "::notice::To rebuild now: gh workflow run deploy.yml --repo IslamBaraka90/fintech-algorithms-docs"
            exit 0
          fi
          if GH_TOKEN="$DOCS_TOKEN" gh workflow run deploy.yml \
               --repo IslamBaraka90/fintech-algorithms-docs \
               --ref main; then
            echo "::notice::Reference site rebuild dispatched."
          else
            echo "::warning::Could not dispatch the docs rebuild — check DOCS_DISPATCH_TOKEN."
            echo "::warning::Run by hand: gh workflow run deploy.yml --repo IslamBaraka90/fintech-algorithms-docs"
          fi
