name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      # Runs off src/ via type-stripping — no build needed.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Proves the published tarball is self-contained: the exports map resolves,
      # dist/ is complete, and no file the package needs was left out of `files`.
      - name: Pack and smoke-test the tarball
        run: |
          npm pack
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/fintech-algorithms-*.tgz
          node --input-type=module -e '
            import { topics } from "fintech-algorithms";
            const { calculateEma } = await import("fintech-algorithms/technical-indicators/trend-smoothing/ema");
            if (topics.length === 0) throw new Error("registry is empty");
            const out = calculateEma([10, 13, 16, 19], 3);
            if (out[2] !== 13 || out[3] !== 16) throw new Error("EMA regression: " + JSON.stringify(out));
            console.log(`tarball OK — ${topics.length} topics resolvable from a clean consumer`);
          '

  # The package is generated from the edufintech catalog, which lives in a
  # different repository. This job only runs when that checkout is available.
  sync-drift:
    runs-on: ubuntu-latest
    if: ${{ vars.EDUFINTECH_REPO != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: package

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.EDUFINTECH_REPO }}
          token: ${{ secrets.EDUFINTECH_TOKEN }}
          path: catalog

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fail if the package has drifted from the catalog
        working-directory: package
        run: node scripts/sync.mjs --check --content-root ../catalog
